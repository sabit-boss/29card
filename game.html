<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29 - Playing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="team-score team-a">
                <h3 id="teamATitle">Team A</h3>
                <div class="score-value" id="scoreA">0</div>
                <div class="cards-count" id="cardsA">Points: 0</div>
            </div>
            <div class="team-score team-b">
                <h3 id="teamBTitle">Team B</h3>
                <div class="score-value" id="scoreB">0</div>
                <div class="cards-count" id="cardsB">Points: 0</div>
            </div>
        </div>

        <!-- Host only: abort the round -->
        <button id="cancelGame" class="btn btn-secondary cancel-btn" style="display:none">✖ Cancel Game</button>

        <!-- Bidding UI -->
        <div id="biddingPanel" class="bidding-panel" style="display:none">
            <h3 id="biddingStatus"></h3>
            <div class="bid-controls">
                <div class="bid-buttons">
                    <button class="btn btn-secondary" onclick="placeBid(0)">Pass</button>
                    <button class="btn btn-primary" onclick="showBidSelector()">Place Bid</button>
                </div>
                <div id="bidSelector" class="bid-selector" style="display:none">
                    <p>Bid the points your team will take (16–29):</p>
                    <div class="bid-options">
                        <button class="bid-opt" onclick="confirmBid(16)">16</button>
                        <button class="bid-opt" onclick="confirmBid(17)">17</button>
                        <button class="bid-opt" onclick="confirmBid(18)">18</button>
                        <button class="bid-opt" onclick="confirmBid(19)">19</button>
                        <button class="bid-opt" onclick="confirmBid(20)">20</button>
                        <button class="bid-opt" onclick="confirmBid(21)">21</button>
                        <button class="bid-opt" onclick="confirmBid(22)">22</button>
                        <button class="bid-opt" onclick="confirmBid(23)">23</button>
                        <button class="bid-opt" onclick="confirmBid(24)">24</button>
                        <button class="bid-opt" onclick="confirmBid(25)">25</button>
                        <button class="bid-opt" onclick="confirmBid(26)">26</button>
                        <button class="bid-opt" onclick="confirmBid(27)">27</button>
                        <button class="bid-opt" onclick="confirmBid(28)">28</button>
                        <button class="bid-opt" onclick="confirmBid(29)">29</button>
                    </div>
                    <p class="bid-hint">The winner of the auction declares trump.</p>
                </div>
            </div>
            <div id="bidHistory" class="bid-history"></div>
        </div>

        <!-- Trump Selection UI (for winning bidder) -->
        <div id="trumpSelectPanel" class="trump-select-panel" style="display:none">
            <h3>Choose your trump suit</h3>
            <p id="trumpSelectHint"></p>
            <div class="trump-options">
                <button class="trump-opt" onclick="selectTrump('hearts')">♥ Hearts</button>
                <button class="trump-opt" onclick="selectTrump('diamonds')">♦ Diamonds</button>
                <button class="trump-opt" onclick="selectTrump('clubs')">♣ Clubs</button>
                <button class="trump-opt" onclick="selectTrump('spades')">♠ Spades</button>
            </div>
        </div>

        <!-- Game Table -->
        <div class="game-table" id="gameTable">
            <!-- Partner (Top) -->
            <div class="player-seat seat-top" id="pos-top">
                <div class="player-name">Partner</div>
                <div class="cards-container back-cards"></div>
            </div>

            <!-- Opponent (Left) -->
            <div class="player-seat seat-left" id="pos-left">
                <div class="player-name">Opponent</div>
                <div class="cards-container back-cards"></div>
            </div>

            <!-- Center - Trick Area -->
            <div class="trick-area">
                <div class="trump-indicator" id="trumpIndicator">Trump: <span id="trumpSuit">?</span></div>
                <div class="trick-cards" id="trickCards">
                    <div class="trick-slot"><div class="trick-card empty"></div></div>
                    <div class="trick-slot"><div class="trick-card empty"></div></div>
                    <div class="trick-slot"><div class="trick-card empty"></div></div>
                    <div class="trick-slot"><div class="trick-card empty"></div></div>
                </div>
                <div class="trick-banner" id="trickBanner"></div>
                <div class="turn-indicator" id="turnIndicator"></div>
            </div>

            <!-- Opponent (Right) -->
            <div class="player-seat seat-right" id="pos-right">
                <div class="player-name">Opponent</div>
                <div class="cards-container back-cards"></div>
            </div>

            <!-- You (Bottom) -->
            <div class="player-seat seat-bottom" id="pos-bottom">
                <div class="cards-container your-hand" id="cards0"></div>
                <div class="player-name">You</div>
            </div>
        </div>

        <!-- Chat -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Type a message..." maxlength="100">
                <button id="chatSend">Send</button>
            </div>
        </div>

        <!-- Toast for errors / notices -->
        <div class="game-toast" id="gameToast"></div>

        <!-- Result Overlay -->
        <div class="result-overlay" id="resultOverlay" style="display:none">
            <div class="result-box">
                <h2 id="resultTitle"></h2>
                <p id="resultMessage"></p>
                <div class="result-actions">
                    <button class="btn btn-success" id="playAgain">▶ Play Again</button>
                    <span class="play-again-hint" id="playAgainHint" style="display:none">Waiting for the host to start the next round…</span>
                </div>
                <button class="btn btn-primary" id="backToLobby">Back to Lobby</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
